<!DOCTYPE html>
<html>
<head>
    <title>Test Notification Form</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1d24; color: #fff; }
        .channel-chip { display: inline-block; margin: 5px; padding: 10px; border: 2px solid #444; cursor: pointer; }
        .channel-chip.checked { border-color: #6366f1; background: #6366f122; }
        input[type="checkbox"] { margin-right: 5px; }
        button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; background: #2a2d35; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Channel Selection Test</h2>
    
    <div>
        <label class="channel-chip" data-channel="email">
            <input type="checkbox" value="email" checked> Email
        </label>
        <label class="channel-chip checked" data-channel="sms">
            <input type="checkbox" value="sms"> SMS
        </label>
        <label class="channel-chip" data-channel="push">
            <input type="checkbox" value="push"> Push
        </label>
        <label class="channel-chip" data-channel="inapp">
            <input type="checkbox" value="inapp"> In-App
        </label>
    </div>
    
    <button onclick="testChannels()">Test Channel Selection</button>
    <button onclick="selectAll()">Select All</button>
    
    <div id="result"></div>
    
    <script>
        // Initialize
        document.querySelectorAll('.channel-chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                if (e.target.type === 'checkbox') return;
                const checkbox = chip.querySelector('input[type="checkbox"]');
                checkbox.checked = !checkbox.checked;
                chip.classList.toggle('checked', checkbox.checked);
            });
            
            const checkbox = chip.querySelector('input[type="checkbox"]');
            checkbox.addEventListener('change', () => {
                chip.classList.toggle('checked', checkbox.checked);
            });
        });
        
        function testChannels() {
            const channels = [...document.querySelectorAll('.channel-chip input[type="checkbox"]:checked')]
                .map(cb => cb.value);
            
            document.getElementById('result').innerHTML = 
                '<strong>Selected Channels:</strong><br>' + 
                (channels.length ? channels.join(', ') : 'None') +
                '<br><br><strong>Count:</strong> ' + channels.length;
        }
        
        function selectAll() {
            document.querySelectorAll('.channel-chip').forEach(chip => {
                chip.classList.add('checked');
                const checkbox = chip.querySelector('input[type="checkbox"]');
                if (checkbox) checkbox.checked = true;
            });
        }
    </script>
</body>
</html>
